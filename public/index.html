<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Multimedia</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-chat: #090d16;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-mine: #1e40af;
      --msg-other: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; }
    .chat-container { width: 100%; max-width: 500px; height: 92vh; background: var(--bg-card); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; }
    
    /* Overlay para selección de Usuario */
    .user-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99; padding: 20px; text-align: center; }
    .user-modal h3 { margin-bottom: 20px; font-size: 1.3rem; }
    .user-options { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 320px; }
    .btn-user { flex: 1; min-width: 120px; padding: 14px; background: #334155; border: 2px solid var(--accent); color: #fff; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-user:hover { background: var(--accent); }

    .header { background: var(--bg-card); padding: 16px; text-align: center; border-bottom: 1px solid #334155; position: relative; }
    .header h2 { font-size: 1.1rem; color: var(--text-main); }
    .room-info { font-size: 0.8rem; color: var(--accent); margin-top: 4px; font-weight: 600; }
    .typing-indicator { font-size: 0.75rem; color: var(--text-muted); height: 16px; margin-top: 2px; }

    .btn-notify { position: absolute; right: 16px; top: 16px; background: transparent; border: none; font-size: 1.2rem; cursor: pointer; }
    .user-tag { position: absolute; left: 16px; top: 18px; font-size: 0.75rem; background: #334155; padding: 4px 8px; border-radius: 6px; cursor: pointer; }

    .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: var(--bg-chat); }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; background: var(--msg-other); align-self: flex-start; word-wrap: break-word; }
    .message.mine { background: var(--msg-mine); align-self: flex-end; }
    .message .meta { font-size: 0.7rem; color: #cbd5e1; font-weight: bold; margin-bottom: 4px; }
    .message .time { font-size: 0.65rem; color: var(--text-muted); text-align: right; margin-top: 4px; }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 6px; }
    .message audio { max-width: 100%; margin-top: 6px; }

    .input-area { padding: 12px; background: var(--bg-card); display: flex; gap: 8px; align-items: center; border-top: 1px solid #334155; }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 20px; outline: none; font-size: 0.9rem; }
    
    .btn-icon { background: #334155; color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
    .btn-icon:hover { background: var(--accent); }
    .btn-send { background: var(--accent); color: #fff; border: none; padding: 0 16px; height: 38px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-send:hover { background: var(--accent-hover); }
    .btn-rec.recording { background: #ef4444; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<!-- Modal para elegir perfil al entrar -->
<div class="user-modal" id="userModal">
  <h3>¿Quién eres?</h3>
  <div class="user-options">
    <!-- Puedes cambiar estos nombres por los que desees -->
    <button class="btn-user" onclick="selectUser('Alex')">👤 Alex</button>
    <button class="btn-user" onclick="selectUser('Sofía')">👤 Sofía</button>
  </div>
</div>

<div class="chat-container">
  <div class="header">
    <div class="user-tag" id="userTag" title="Cambiar usuario">...</div>
    <button class="btn-notify" id="notifyBtn" title="Activar Notificaciones">🔔</button>
    <h2>💬 Chat Privado</h2>
    <div class="room-info" id="roomLabel">Conectando...</div>
    <div class="typing-indicator" id="typingLabel"></div>
  </div>

  <div class="messages-box" id="messagesBox"></div>

  <div class="input-area">
    <label class="btn-icon" title="Enviar Imagen">
      📷
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
    </label>

    <button class="btn-icon btn-rec" id="recBtn" title="Grabar Audio">🎤</button>

    <input type="text" id="messageInput" placeholder="Escribe algo..." autocomplete="off">
    <button class="btn-send" id="sendBtn">Enviar</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Gestión de Usuario mediante localStorage
  let currentUser = localStorage.getItem('chat_username') || '';
  const userModal = document.getElementById('userModal');
  const userTag = document.getElementById('userTag');

  function updateUserInfo() {
    if (currentUser) {
      userModal.style.display = 'none';
      userTag.textContent = `👤 ${currentUser}`;
    } else {
      userModal.style.display = 'flex';
    }
  }

  function selectUser(name) {
    currentUser = name;
    localStorage.setItem('chat_username', name);
    updateUserInfo();
    // Volver a vincular las notificaciones al nuevo usuario si la campana ya estaba activa
    autoSubscribePush();
  }

  userTag.addEventListener('click', () => {
    userModal.style.display = 'flex';
  });

  updateUserInfo();

  // Registrar Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service Worker listo:', reg))
      .catch(err => console.error('Error al registrar Service Worker:', err));
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  // Gestión de Sala
  let room = window.location.hash.substring(1);
  if (!room) {
    room = "sala-principal";
    window.location.hash = room;
  }
  document.getElementById('roomLabel').textContent = `#${room}`;
  socket.emit('joinRoom', room);

  // Elementos HTML
  const messagesBox = document.getElementById('messagesBox');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const imageInput = document.getElementById('imageInput');
  const recBtn = document.getElementById('recBtn');
  const typingLabel = document.getElementById('typingLabel');
  const notifyBtn = document.getElementById('notifyBtn');

  const notifySound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

  // Función para suscribir Push vinculada al usuario
  async function autoSubscribePush() {
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !currentUser) return;
    if (Notification.permission === 'granted') {
      try {
        const reg = await navigator.serviceWorker.ready;
        const response = await fetch('/vapidPublicKey');
        const vapidPublicKey = await response.text();

        const subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
        });

        await fetch('/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subscription: subscription,
            user: currentUser
          })
        });
      } catch (err) {
        console.error('Error al autosuscribir:', err);
      }
    }
  }

  notifyBtn.addEventListener('click', async () => {
    if (!currentUser) {
      alert('Primero selecciona un usuario.');
      return;
    }

    try {
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        await autoSubscribePush();
        alert(`¡Notificaciones Push activadas para ${currentUser}!`);
      } else {
        alert('Debes permitir el permiso en la configuración de tu dispositivo.');
      }
    } catch (err) {
      console.error('Error en notificaciones:', err);
    }
  });

  socket.on('loadHistory', (history) => {
    messagesBox.innerHTML = '';
    history.forEach(data => renderMessage(data, false));
  });

  function sendMessage() {
    const text = messageInput.value.trim();
    if (text !== '' && currentUser) {
      socket.emit('sendMessage', { room, user: currentUser, message: text });
      messageInput.value = '';
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
    socket.emit('typing', { room, user: currentUser });
  });

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file && currentUser) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        socket.emit('sendMessage', { room, user: currentUser, file: evt.target.result, fileType: 'image' });
      };
      reader.readAsDataURL(file);
    }
  });

  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;

  recBtn.addEventListener('click', async () => {
    if (!currentUser) return;
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = (evt) => {
            socket.emit('sendMessage', { room, user: currentUser, file: evt.target.result, fileType: 'audio' });
          };
          reader.readAsDataURL(audioBlob);
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.classList.add('recording');
      } catch (err) {
        alert('Se necesita permiso para usar el micrófono.');
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      recBtn.classList.remove('recording');
    }
  });

  function renderMessage(data, playAlerts = true) {
    const isMine = data.user === currentUser;
    const textContent = data.text || data.message || '';

    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message');
    if (isMine) msgDiv.classList.add('mine');

    let contentHtml = `<div class="meta">${data.user}</div>`;
    
    if (textContent) contentHtml += `<div class="text">${textContent}</div>`;
    if (data.fileType === 'image') contentHtml += `<img src="${data.file}" alt="Imagen">`;
    if (data.fileType === 'audio') contentHtml += `<audio src="${data.file}" controls></audio>`;
    
    contentHtml += `<div class="time">${data.time}</div>`;
    msgDiv.innerHTML = contentHtml;

    messagesBox.appendChild(msgDiv);
    messagesBox.scrollTop = messagesBox.scrollHeight;

    if (playAlerts && !isMine) {
      notifySound.play().catch(() => {});
    }
  }

  socket.on('newMessage', (data) => {
    renderMessage(data, true);
  });

  let typingTimeout;
  socket.on('userTyping', (user) => {
    typingLabel.textContent = `${user} está escribiendo...`;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { typingLabel.textContent = ''; }, 2000);
  });
</script>
</body>
</html>
