<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Privado Directo</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-chat: #090d16;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-mine: #1e40af;
      --msg-other: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; }
    
    .chat-container { width: 100%; max-width: 480px; height: 92vh; background: var(--bg-card); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; position: relative; }
    
    /* Overlay para Selección de Usuario */
    .user-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; text-align: center; }
    .user-modal h3 { margin-bottom: 8px; font-size: 1.4rem; }
    .user-modal p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }
    .user-options { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
    .btn-user { width: 100%; padding: 14px; background: #334155; border: 2px solid var(--accent); color: #fff; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-user:hover { background: var(--accent); }

    /* Pantalla de Contactos / Chats */
    .contacts-screen { display: flex; flex-direction: column; height: 100%; width: 100%; background: var(--bg-card); }
    .contacts-header { padding: 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .contacts-list { flex: 1; overflow-y: auto; padding: 8px; }
    .contact-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .contact-item:hover { background: #334155; }
    .contact-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; }
    .contact-info { flex: 1; }
    .contact-name { font-weight: 600; font-size: 1rem; }
    .contact-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* Pantalla de Conversación Directa */
    .conversation-screen { display: none; flex-direction: column; height: 100%; width: 100%; background: var(--bg-chat); }
    .header { background: var(--bg-card); padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
    .btn-back { background: transparent; border: none; color: var(--text-main); font-size: 1.3rem; cursor: pointer; padding: 4px; }
    .header-info { flex: 1; }
    .header-info h2 { font-size: 1rem; }
    .typing-indicator { font-size: 0.75rem; color: var(--accent); height: 14px; }

    .btn-notify { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; }

    .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; background: var(--msg-other); align-self: flex-start; word-wrap: break-word; }
    .message.mine { background: var(--msg-mine); align-self: flex-end; }
    .message .time { font-size: 0.65rem; color: var(--text-muted); text-align: right; margin-top: 4px; }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 6px; }
    .message audio { max-width: 100%; margin-top: 6px; }

    .input-area { padding: 12px; background: var(--bg-card); display: flex; gap: 8px; align-items: center; border-top: 1px solid #334155; }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 20px; outline: none; font-size: 0.9rem; }
    
    .btn-icon { background: #334155; color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
    .btn-icon:hover { background: var(--accent); }
    .btn-send { background: var(--accent); color: #fff; border: none; padding: 0 16px; height: 38px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-send:hover { background: var(--accent-hover); }
    .btn-rec.recording { background: #ef4444; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="chat-container">

  <!-- Modal Inicial: Identificación -->
  <div class="user-modal" id="userModal">
    <h3>¿Quién eres?</h3>
    <p>Selecciona tu perfil en este dispositivo</p>
    <div class="user-options">
      <!-- Cambia o agrega usuarios según lo requieras -->
      <button class="btn-user" onclick="selectProfile('Alex')">👤 Alex</button>
      <button class="btn-user" onclick="selectProfile('Sofía')">👤 Sofía</button>
    </div>
  </div>

  <!-- Vista 1: Lista de Contactos (WhatsApp style) -->
  <div class="contacts-screen" id="contactsScreen">
    <div class="contacts-header">
      <h2 id="myProfileTitle">Chats</h2>
      <div>
        <button class="btn-notify" id="notifyBtn" title="Activar Notificaciones">🔔</button>
        <button class="btn-back" onclick="changeProfile()" title="Cambiar de perfil">⚙️</button>
      </div>
    </div>
    <div class="contacts-list" id="contactsList">
      <!-- Se genera dinámicamente -->
    </div>
  </div>

  <!-- Vista 2: Chat 1 a 1 -->
  <div class="conversation-screen" id="conversationScreen">
    <div class="header">
      <button class="btn-back" onclick="closeChat()">←</button>
      <div class="header-info">
        <h2 id="activeContactName">Contacto</h2>
        <div class="typing-indicator" id="typingLabel"></div>
      </div>
    </div>

    <div class="messages-box" id="messagesBox"></div>

    <div class="input-area">
      <label class="btn-icon" title="Enviar Imagen">
        📷
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
      </label>

      <button class="btn-icon btn-rec" id="recBtn" title="Grabar Audio">🎤</button>

      <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
      <button class="btn-send" id="sendBtn">Enviar</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Lista de usuarios registrados en el sistema
  const ALL_USERS = ['Alex', 'Sofía'];

  let currentUser = localStorage.getItem('chat_username') || '';
  let activeReceiver = '';

  const userModal = document.getElementById('userModal');
  const contactsScreen = document.getElementById('contactsScreen');
  const conversationScreen = document.getElementById('conversationScreen');
  const contactsList = document.getElementById('contactsList');
  const myProfileTitle = document.getElementById('myProfileTitle');
  const activeContactName = document.getElementById('activeContactName');
  const messagesBox = document.getElementById('messagesBox');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const imageInput = document.getElementById('imageInput');
  const recBtn = document.getElementById('recBtn');
  const typingLabel = document.getElementById('typingLabel');
  const notifyBtn = document.getElementById('notifyBtn');

  const notifySound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

  // Registrar Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service Worker listo:', reg))
      .catch(err => console.error('Error al registrar Service Worker:', err));
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  function initApp() {
    if (currentUser) {
      userModal.style.display = 'none';
      myProfileTitle.textContent = `Chats (${currentUser})`;
      renderContacts();
      autoSubscribePush();
    } else {
      userModal.style.display = 'flex';
    }
  }

  function selectProfile(name) {
    currentUser = name;
    localStorage.setItem('chat_username', name);
    initApp();
  }

  function changeProfile() {
    userModal.style.display = 'flex';
  }

  function renderContacts() {
    contactsList.innerHTML = '';
    const otherUsers = ALL_USERS.filter(u => u !== currentUser);

    otherUsers.forEach(user => {
      const item = document.createElement('div');
      item.classList.add('contact-item');
      item.innerHTML = `
        <div class="contact-avatar">${user.charAt(0)}</div>
        <div class="contact-info">
          <div class="contact-name">${user}</div>
          <div class="contact-sub">Toca para abrir chat privado</div>
        </div>
      `;
      item.onclick = () => openChat(user);
      contactsList.appendChild(item);
    });
  }

  function openChat(receiverName) {
    activeReceiver = receiverName;
    activeContactName.textContent = receiverName;
    contactsScreen.style.display = 'none';
    conversationScreen.style.display = 'flex';

    // Unirse a la sala 1 a 1 en el servidor
    socket.emit('joinRoom', { sender: currentUser, receiver: activeReceiver });
  }

  function closeChat() {
    activeReceiver = '';
    conversationScreen.style.display = 'none';
    contactsScreen.style.display = 'flex';
  }

  // Notificaciones Web Push
  async function autoSubscribePush() {
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !currentUser) return;
    if (Notification.permission === 'granted') {
      try {
        const reg = await navigator.serviceWorker.ready;
        const response = await fetch('/vapidPublicKey');
        const vapidPublicKey = await response.text();

        const subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
        });

        await fetch('/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subscription: subscription,
            user: currentUser
          })
        });
      } catch (err) {
        console.error('Error al suscribir notificaciones:', err);
      }
    }
  }

  notifyBtn.addEventListener('click', async () => {
    if (!currentUser) return;
    try {
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        await autoSubscribePush();
        alert(`¡Notificaciones activadas para ${currentUser}!`);
      } else {
        alert('Debes otorgar permisos en la configuración de tu navegador.');
      }
    } catch (err) {
      console.error('Error:', err);
    }
  });

  // Renderizado de mensajes
  socket.on('loadHistory', (history) => {
    messagesBox.innerHTML = '';
    history.forEach(data => renderMessage(data, false));
  });

  function sendMessage() {
    const text = messageInput.value.trim();
    if (text !== '' && currentUser && activeReceiver) {
      socket.emit('sendMessage', {
        sender: currentUser,
        receiver: activeReceiver,
        message: text
      });
      messageInput.value = '';
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
    if (activeReceiver) {
      socket.emit('typing', { sender: currentUser, receiver: activeReceiver });
    }
  });

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file && currentUser && activeReceiver) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        socket.emit('sendMessage', {
          sender: currentUser,
          receiver: activeReceiver,
          file: evt.target.result,
          fileType: 'image'
        });
      };
      reader.readAsDataURL(file);
    }
  });

  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;

  recBtn.addEventListener('click', async () => {
    if (!currentUser || !activeReceiver) return;
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = (evt) => {
            socket.emit('sendMessage', {
              sender: currentUser,
              receiver: activeReceiver,
              file: evt.target.result,
              fileType: 'audio'
            });
          };
          reader.readAsDataURL(audioBlob);
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.classList.add('recording');
      } catch (err) {
        alert('Permiso de micrófono denegado.');
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      recBtn.classList.remove('recording');
    }
  });

  function renderMessage(data, playAlerts = true) {
    const isMine = data.sender === currentUser;
    const textContent = data.text || '';

    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message');
    if (isMine) msgDiv.classList.add('mine');

    let contentHtml = '';
    if (textContent) contentHtml += `<div class="text">${textContent}</div>`;
    if (data.fileType === 'image') contentHtml += `<img src="${data.file}" alt="Imagen">`;
    if (data.fileType === 'audio') contentHtml += `<audio src="${data.file}" controls></audio>`;
    
    contentHtml += `<div class="time">${data.time}</div>`;
    msgDiv.innerHTML = contentHtml;

    messagesBox.appendChild(msgDiv);
    messagesBox.scrollTop = messagesBox.scrollHeight;

    if (playAlerts && !isMine) {
      notifySound.play().catch(() => {});
    }
  }

  socket.on('newMessage', (data) => {
    // Solo mostrar en pantalla si el mensaje pertenece al chat que está abierto actualmente
    if (
      (data.sender === currentUser && data.receiver === activeReceiver) ||
      (data.sender === activeReceiver && data.receiver === currentUser)
    ) {
      renderMessage(data, true);
    }
  });

  let typingTimeout;
  socket.on('userTyping', (sender) => {
    if (sender === activeReceiver) {
      typingLabel.textContent = 'escribiendo...';
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { typingLabel.textContent = ''; }, 2000);
    }
  });

  initApp();
</script>
</body>
</html>
