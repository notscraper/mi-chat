<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Web</title>
  <style>
    :root {
      --wa-header-bg: #075e54;
      --wa-teal: #128c7e;
      --wa-bg: #efeae2;
      --wa-msg-out: #dcf8c6;
      --wa-msg-in: #ffffff;
      --wa-text: #111b21;
      --wa-muted: #667781;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    
    html, body {
      touch-action: manipulation;
      height: 100vh;
      background: #d1d7db;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 95vh;
      background: var(--wa-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border-radius: 12px;
      position: relative;
    }

    /* VISTA 1: Lista de Chats Guardados Localmente */
    .chats-list-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #ffffff;
    }

    .chats-header {
      background: var(--wa-header-bg);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chats-header h2 { font-size: 1.1rem; }

    .user-nickname-input {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 16px !important;
      width: 120px;
      outline: none;
    }

    .actions-bar {
      padding: 10px 16px;
      background: #f0f2f5;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #e0e0e0;
    }

    .btn-create-chat {
      flex: 1;
      background: var(--wa-teal);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-join-chat {
      flex: 1;
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .chats-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f2f5;
      cursor: pointer;
    }

    .chat-item:hover { background: #f5f6f6; }

    .chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #128c7e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .chat-details { flex: 1; }
    .chat-title { font-weight: 600; color: var(--wa-text); font-size: 0.95rem; }
    .chat-sub { font-size: 0.75rem; color: var(--wa-muted); margin-top: 2px; }

    .btn-delete-room {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
    }

    /* VISTA 2: Conversación Abierta */
    .conversation-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    .header {
      background: var(--wa-header-bg);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }

    .btn-back {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
    }

    .header-details h2 { font-size: 1rem; line-height: 1.2; }
    .typing-indicator { font-size: 0.75rem; color: #e9edef; font-style: italic; height: 14px; }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .btn-header {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Modal / Menú para cambiar Fondo */
    .bg-modal {
      display: none;
      position: absolute;
      top: 50px;
      right: 10px;
      background: #ffffff;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 100;
      width: 240px;
      flex-direction: column;
      gap: 10px;
    }

    .bg-modal h3 { font-size: 0.9rem; color: var(--wa-text); }
    
    .bg-modal button, .bg-modal label {
      background: #f0f2f5;
      border: 1px solid #d1d7db;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      color: var(--wa-text);
      font-weight: 500;
    }

    .bg-modal label {
      display: block;
    }

    .messages-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-color: var(--wa-bg);
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 16px 16px;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      transition: background 0.3s ease;
    }

    .message {
      max-width: 75%;
      padding: 6px 10px 8px 10px;
      border-radius: 7.5px;
      font-size: 0.9rem;
      background: var(--wa-msg-in);
      color: var(--wa-text);
      align-self: flex-start;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 1px 0.5px rgba(11,20,26,0.13);
    }

    .message.mine {
      background: var(--wa-msg-out);
      align-self: flex-end;
    }

    .message .sender-name {
      font-size: 0.75rem;
      font-weight: bold;
      color: #e542a3;
      margin-bottom: 2px;
    }

    .message.mine .sender-name { display: none; }

    .message .time {
      font-size: 0.65rem;
      color: var(--wa-muted);
      float: right;
      margin-top: 4px;
      margin-left: 10px;
    }

    .message img { max-width: 100%; border-radius: 6px; margin-top: 4px; }
    .message audio { max-width: 100%; margin-top: 4px; }

    .input-area {
      padding: 8px 12px;
      background: #f0f2f5;
      display: flex;
      gap: 8px;
      align-items: center;
      border-top: 1px solid #e0e0e0;
      z-index: 2;
    }

    .input-area input[type="text"] {
      flex: 1;
      padding: 9px 14px;
      background: #ffffff;
      border: none;
      color: var(--wa-text);
      border-radius: 20px;
      outline: none;
      font-size: 16px !important;
    }

    .btn-icon-wa {
      background: transparent;
      color: #54656f;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .btn-send-wa {
      background: var(--wa-teal);
      color: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .btn-rec-wa.recording {
      color: #ea4335;
      animation: pulse 1s infinite;
    }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="chat-container">

  <!-- VISTA 1: Lista de Chats -->
  <div class="chats-list-screen" id="chatsListScreen">
    <div class="chats-header">
      <h2>WhatsApp</h2>
      <input type="text" class="user-nickname-input" id="nicknameInput" placeholder="Mi Apodo..." title="Cambia tu nombre aquí">
    </div>

    <div class="actions-bar">
      <button class="btn-create-chat" onclick="createNewChat()">➕ Nuevo Chat</button>
      <button class="btn-join-chat" onclick="joinExistingChat()">🔗 Unirse por Código</button>
    </div>

    <div class="chats-list" id="chatsList"></div>
  </div>

  <!-- VISTA 2: Conversación Abierta -->
  <div class="conversation-screen" id="conversationScreen">
    <div class="header">
      <button class="btn-back" onclick="closeChat()">←</button>
      <div class="header-details">
        <h2 id="activeRoomTitle">Nombre Sala</h2>
        <div class="typing-indicator" id="typingLabel"></div>
      </div>
      
      <div class="header-actions">
        <button class="btn-header" id="themeBtn" title="Cambiar Fondo del Chat">🎨</button>
        <button class="btn-header" id="notifyBtn" title="Activar Notificaciones">🔔</button>
      </div>
    </div>

    <!-- Menú Modal de Selección de Fondo -->
    <div class="bg-modal" id="bgModal">
      <h3>Cambiar Fondo de Chat</h3>
      <label for="bgFileInput">🖼️ Subir desde Galería</label>
      <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
      
      <button onclick="promptBgUrl()">🔗 Pegar URL de Imagen</button>
      <button onclick="resetDefaultBg()">↩️ Restablecer Original</button>
    </div>

    <div class="messages-box" id="messagesBox"></div>

    <div class="input-area">
      <label class="btn-icon-wa" title="Adjuntar imagen">
        📷
        <input type="file" id="imageInput" accept="image/*" style="display:none;">
      </label>

      <button class="btn-icon-wa btn-rec-wa" id="recBtn" title="Grabar nota de voz">🎤</button>

      <input type="text" id="messageInput" placeholder="Escribe un mensaje" autocomplete="off">
      <button class="btn-send-wa" id="sendBtn" title="Enviar">➤</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Elementos principales
  const nicknameInput = document.getElementById('nicknameInput');
  const chatsListScreen = document.getElementById('chatsListScreen');
  const conversationScreen = document.getElementById('conversationScreen');
  const chatsList = document.getElementById('chatsList');
  const activeRoomTitle = document.getElementById('activeRoomTitle');
  const messagesBox = document.getElementById('messagesBox');
  const bgModal = document.getElementById('bgModal');
  const themeBtn = document.getElementById('themeBtn');
  const bgFileInput = document.getElementById('bgFileInput');

  // Gestión de Apodo Personal
  nicknameInput.value = localStorage.getItem('chat_nickname') || 'User_' + Math.floor(Math.random() * 899 + 100);
  nicknameInput.addEventListener('change', () => {
    localStorage.setItem('chat_nickname', nicknameInput.value.trim());
  });

  // Gestión de Lista Local de Salas por Celular
  let myRooms = JSON.parse(localStorage.getItem('my_chat_rooms') || '[]');
  let activeRoom = '';

  // Gestión del Fondo Personalizado
  function applySavedBackground() {
    const savedBg = localStorage.getItem('chat_custom_bg');
    if (savedBg) {
      messagesBox.style.backgroundImage = `url('${savedBg}')`;
      messagesBox.style.backgroundSize = 'cover';
      messagesBox.style.backgroundPosition = 'center';
    } else {
      messagesBox.style.backgroundImage = 'radial-gradient(#cbd5e1 1px, transparent 1px)';
      messagesBox.style.backgroundSize = '16px 16px';
    }
  }

  themeBtn.addEventListener('click', () => {
    bgModal.style.display = bgModal.style.display === 'flex' ? 'none' : 'flex';
  });

  // Cargar imagen desde Galería Local
  bgFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        const bgData = evt.target.result;
        localStorage.setItem('chat_custom_bg', bgData);
        applySavedBackground();
        bgModal.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }
  });

  // Aplicar fondo mediante URL externa
  function promptBgUrl() {
    const url = prompt('Ingresa la URL de la imagen de fondo:');
    if (url && url.trim() !== '') {
      localStorage.setItem('chat_custom_bg', url.trim());
      applySavedBackground();
      bgModal.style.display = 'none';
    }
  }

  // Restablecer el fondo predeterminado estilo WhatsApp
  function resetDefaultBg() {
    localStorage.removeItem('chat_custom_bg');
    applySavedBackground();
    bgModal.style.display = 'none';
  }

  // Si se abre por URL con hash directo
  const initialHash = window.location.hash.substring(1);
  if (initialHash && !myRooms.includes(initialHash)) {
    myRooms.push(initialHash);
    saveRooms();
  }

  function saveRooms() {
    localStorage.setItem('my_chat_rooms', JSON.stringify(myRooms));
    renderChatsList();
  }

  function renderChatsList() {
    chatsList.innerHTML = '';
    if (myRooms.length === 0) {
      chatsList.innerHTML = `<div style="padding:20px; text-align:center; color:#667781; font-size:0.9rem;">No tienes chats aún.<br>Crea uno nuevo o únete con un código.</div>`;
      return;
    }

    myRooms.forEach(roomName => {
      const item = document.createElement('div');
      item.classList.add('chat-item');
      item.innerHTML = `
        <div class="chat-avatar">💬</div>
        <div class="chat-details" onclick="openChat('${roomName}')">
          <div class="chat-title">#${roomName}</div>
          <div class="chat-sub">Toca para abrir la conversación</div>
        </div>
        <button class="btn-delete-room" onclick="deleteRoom('${roomName}')" title="Eliminar este chat de mi teléfono">🗑️</button>
      `;
      chatsList.appendChild(item);
    });
  }

  function createNewChat() {
    const roomCode = 'sala-' + Math.random().toString(36).substring(2, 8);
    myRooms.unshift(roomCode);
    saveRooms();
    openChat(roomCode);
  }

  function joinExistingChat() {
    const code = prompt('Ingresa el nombre o código del chat al que te quieres unir:');
    if (code) {
      const cleanCode = code.replace('#', '').trim();
      if (cleanCode && !myRooms.includes(cleanCode)) {
        myRooms.unshift(cleanCode);
        saveRooms();
      }
      if (cleanCode) openChat(cleanCode);
    }
  }

  function deleteRoom(roomName) {
    if (confirm(`¿Quitar el chat #${roomName} de la lista de este celular?`)) {
      myRooms = myRooms.filter(r => r !== roomName);
      saveRooms();
    }
  }

  function openChat(roomName) {
    activeRoom = roomName;
    window.location.hash = roomName;
    activeRoomTitle.textContent = `#${roomName}`;

    chatsListScreen.style.display = 'none';
    conversationScreen.style.display = 'flex';

    applySavedBackground();

    // Unirse a la sala en el servidor Socket.io
    socket.emit('joinRoom', roomName);
  }

  function closeChat() {
    activeRoom = '';
    window.location.hash = '';
    conversationScreen.style.display = 'none';
    chatsListScreen.style.display = 'flex';
    bgModal.style.display = 'none';
  }

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW activo:', reg))
      .catch(err => console.error('Error SW:', err));
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const imageInput = document.getElementById('imageInput');
  const recBtn = document.getElementById('recBtn');
  const typingLabel = document.getElementById('typingLabel');
  const notifyBtn = document.getElementById('notifyBtn');

  const notifySound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

  // Notificaciones Web Push por sala activa
  async function subscribePush() {
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !activeRoom) return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const response = await fetch('/vapidPublicKey');
      const vapidPublicKey = await response.text();

      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
      });

      await fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subscription: subscription,
          socketId: socket.id,
          room: activeRoom
        })
      });
    } catch (err) {
      console.error('Error Notificaciones:', err);
    }
  }

  notifyBtn.addEventListener('click', async () => {
    try {
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        await subscribePush();
        alert(`Notificaciones Push activadas para #${activeRoom}`);
      }
    } catch (err) {
      console.error(err);
    }
  });

  socket.on('loadHistory', (history) => {
    messagesBox.innerHTML = '';
    history.forEach(data => renderMessage(data, false));
  });

  function sendMessage() {
    const text = messageInput.value.trim();
    const user = nicknameInput.value.trim() || 'Anónimo';
    if (text !== '' && activeRoom) {
      socket.emit('sendMessage', { room: activeRoom, user, message: text });
      messageInput.value = '';
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
    if (activeRoom) {
      socket.emit('typing', { room: activeRoom, user: nicknameInput.value.trim() });
    }
  });

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    const user = nicknameInput.value.trim() || 'Anónimo';
    if (file && activeRoom) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        socket.emit('sendMessage', { room: activeRoom, user, file: evt.target.result, fileType: 'image' });
      };
      reader.readAsDataURL(file);
    }
  });

  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;

  recBtn.addEventListener('click', async () => {
    const user = nicknameInput.value.trim() || 'Anónimo';
    if (!activeRoom) return;

    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = (evt) => {
            socket.emit('sendMessage', { room: activeRoom, user, file: evt.target.result, fileType: 'audio' });
          };
          reader.readAsDataURL(audioBlob);
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.classList.add('recording');
      } catch (err) {
        alert('Permiso de micrófono denegado.');
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      recBtn.classList.remove('recording');
    }
  });

  function renderMessage(data, playAlerts = true) {
    const myName = nicknameInput.value.trim();
    const isMine = data.user === myName;
    const textContent = data.message || data.text || '';

    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message');
    if (isMine) msgDiv.classList.add('mine');

    let contentHtml = `<div class="sender-name">${data.user}</div>`;
    if (textContent) contentHtml += `<span>${textContent}</span>`;
    if (data.fileType === 'image') contentHtml += `<br><img src="${data.file}" alt="Imagen">`;
    if (data.fileType === 'audio') contentHtml += `<br><audio src="${data.file}" controls></audio>`;
    
    const checkmark = isMine ? ' <span style="color:#53bdeb;">✓✓</span>' : '';
    contentHtml += `<div class="time">${data.time}${checkmark}</div>`;
    
    msgDiv.innerHTML = contentHtml;
    messagesBox.appendChild(msgDiv);
    messagesBox.scrollTop = messagesBox.scrollHeight;

    if (playAlerts && !isMine) {
      notifySound.play().catch(() => {});
    }
  }

  socket.on('newMessage', (data) => {
    if (data.room === activeRoom) {
      renderMessage(data, true);
    }
  });

  let typingTimeout;
  socket.on('userTyping', (user) => {
    typingLabel.textContent = `${user} está escribiendo...`;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { typingLabel.textContent = ''; }, 2000);
  });

  renderChatsList();
  applySavedBackground();
</script>
</body>
</html>
