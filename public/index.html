<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Privado</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-chat: #090d16;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-mine: #1e40af;
      --msg-other: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; }
    
    .chat-container { width: 100%; max-width: 480px; height: 92vh; background: var(--bg-card); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; }

    .header { background: var(--bg-card); padding: 14px 16px; border-bottom: 1px solid #334155; position: relative; display: flex; align-items: center; justify-content: space-between; }
    .header-info h2 { font-size: 1.05rem; }
    .room-tag { font-size: 0.75rem; color: var(--accent); font-weight: 600; margin-top: 2px; }
    .typing-indicator { font-size: 0.75rem; color: var(--text-muted); height: 14px; }

    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-action { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-main); }
    .user-input-name { background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; padding: 4px 8px; font-size: 0.8rem; width: 110px; outline: none; }

    .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: var(--bg-chat); }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; background: var(--msg-other); align-self: flex-start; word-wrap: break-word; }
    .message.mine { background: var(--msg-mine); align-self: flex-end; }
    .message .meta { font-size: 0.7rem; color: #cbd5e1; font-weight: bold; margin-bottom: 4px; }
    .message .time { font-size: 0.65rem; color: var(--text-muted); text-align: right; margin-top: 4px; }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 6px; }
    .message audio { max-width: 100%; margin-top: 6px; }

    .input-area { padding: 12px; background: var(--bg-card); display: flex; gap: 8px; align-items: center; border-top: 1px solid #334155; }
    .input-area input[type="text"] { flex: 1; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 20px; outline: none; font-size: 0.9rem; }
    
    .btn-icon { background: #334155; color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
    .btn-icon:hover { background: var(--accent); }
    .btn-send { background: var(--accent); color: #fff; border: none; padding: 0 16px; height: 38px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .btn-send:hover { background: var(--accent-hover); }
    .btn-rec.recording { background: #ef4444; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <div class="header-info">
      <h2>💬 Chat Privado</h2>
      <div class="room-tag" id="roomLabel">Cargando sala...</div>
      <div class="typing-indicator" id="typingLabel"></div>
    </div>
    <div class="header-actions">
      <input type="text" class="user-input-name" id="usernameInput" placeholder="Tu apodo..." title="Cambia tu nombre aquí">
      <button class="btn-action" id="notifyBtn" title="Activar Notificaciones">🔔</button>
      <button class="btn-action" id="newRoomBtn" title="Crear nueva sala privada">➕</button>
    </div>
  </div>

  <div class="messages-box" id="messagesBox"></div>

  <div class="input-area">
    <label class="btn-icon" title="Enviar Imagen">
      📷
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
    </label>

    <button class="btn-icon btn-rec" id="recBtn" title="Grabar Audio">🎤</button>

    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
    <button class="btn-send" id="sendBtn">Enviar</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Nombre opcional guardado en local (sin listas ni perfiles predeterminados)
  const usernameInput = document.getElementById('usernameInput');
  usernameInput.value = localStorage.getItem('chat_nickname') || 'Usuario_' + Math.floor(Math.random() * 8999 + 1000);
  
  usernameInput.addEventListener('change', () => {
    localStorage.setItem('chat_nickname', usernameInput.value.trim());
  });

  // Generación/Lectura de Sala por Hash en la URL
  let room = window.location.hash.substring(1);
  if (!room) {
    // Si entran al link limpio, crea una sala aleatoria única
    room = 'sala-' + Math.random().toString(36).substring(2, 9);
    window.location.hash = room;
  }
  document.getElementById('roomLabel').textContent = `#${room}`;

  // Unirse a la sala indicada en la URL
  socket.emit('joinRoom', room);

  // Botón para generar un nuevo chat independiente
  document.getElementById('newRoomBtn').addEventListener('click', () => {
    const newRoom = 'sala-' + Math.random().toString(36).substring(2, 9);
    window.location.hash = newRoom;
    window.location.reload();
  });

  // Registrar Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service Worker listo:', reg))
      .catch(err => console.error('Error al registrar SW:', err));
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  // Elementos HTML
  const messagesBox = document.getElementById('messagesBox');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const imageInput = document.getElementById('imageInput');
  const recBtn = document.getElementById('recBtn');
  const typingLabel = document.getElementById('typingLabel');
  const notifyBtn = document.getElementById('notifyBtn');

  const notifySound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

  // Notificaciones Web Push asociadas a la sala y socket actual
  async function subscribePush() {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const response = await fetch('/vapidPublicKey');
      const vapidPublicKey = await response.text();

      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
      });

      await fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subscription: subscription,
          socketId: socket.id,
          room: room
        })
      });
    } catch (err) {
      console.error('Error al suscribir notificaciones:', err);
    }
  }

  notifyBtn.addEventListener('click', async () => {
    try {
      const permission = await Notification.requestPermission();
      if (permission === 'granted') {
        await subscribePush();
        alert('¡Notificaciones Push activadas para esta sala!');
      } else {
        alert('Debes otorgar permisos en la configuración de tu dispositivo.');
      }
    } catch (err) {
      console.error('Error:', err);
    }
  });

  socket.on('loadHistory', (history) => {
    messagesBox.innerHTML = '';
    history.forEach(data => renderMessage(data, false));
  });

  function sendMessage() {
    const text = messageInput.value.trim();
    const user = usernameInput.value.trim() || 'Anónimo';
    if (text !== '') {
      socket.emit('sendMessage', { room, user, message: text });
      messageInput.value = '';
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
    socket.emit('typing', { room, user: usernameInput.value.trim() });
  });

  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    const user = usernameInput.value.trim() || 'Anónimo';
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        socket.emit('sendMessage', { room, user, file: evt.target.result, fileType: 'image' });
      };
      reader.readAsDataURL(file);
    }
  });

  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;

  recBtn.addEventListener('click', async () => {
    const user = usernameInput.value.trim() || 'Anónimo';
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = (evt) => {
            socket.emit('sendMessage', { room, user, file: evt.target.result, fileType: 'audio' });
          };
          reader.readAsDataURL(audioBlob);
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.classList.add('recording');
      } catch (err) {
        alert('Permiso de micrófono denegado.');
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      recBtn.classList.remove('recording');
    }
  });

  function renderMessage(data, playAlerts = true) {
    const myName = usernameInput.value.trim();
    const isMine = data.user === myName;
    const textContent = data.message || data.text || '';

    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message');
    if (isMine) msgDiv.classList.add('mine');

    let contentHtml = `<div class="meta">${data.user}</div>`;
    if (textContent) contentHtml += `<div class="text">${textContent}</div>`;
    if (data.fileType === 'image') contentHtml += `<img src="${data.file}" alt="Imagen">`;
    if (data.fileType === 'audio') contentHtml += `<audio src="${data.file}" controls></audio>`;
    
    contentHtml += `<div class="time">${data.time}</div>`;
    msgDiv.innerHTML = contentHtml;

    messagesBox.appendChild(msgDiv);
    messagesBox.scrollTop = messagesBox.scrollHeight;

    if (playAlerts && !isMine) {
      notifySound.play().catch(() => {});
    }
  }

  socket.on('newMessage', (data) => {
    renderMessage(data, true);
  });

  let typingTimeout;
  socket.on('userTyping', (user) => {
    typingLabel.textContent = `${user} está escribiendo...`;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { typingLabel.textContent = ''; }, 2000);
  });
</script>
</body>
</html>
