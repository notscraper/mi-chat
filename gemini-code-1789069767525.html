<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat por URL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .chat-container { width: 100%; max-width: 450px; height: 85vh; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
    .header { background: #075e54; color: #fff; padding: 15px; text-align: center; font-weight: bold; }
    .room-info { background: #128c7e; color: #e0f2f1; padding: 6px 15px; font-size: 0.85rem; text-align: center; }
    .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
    .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; background: #fff; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
    .message.mine { background: #dcf8c6; align-self: flex-end; }
    .message .meta { font-size: 0.7rem; color: #777; font-weight: bold; }
    .message .time { font-size: 0.65rem; color: #999; text-align: right; margin-top: 4px; }
    .input-area { padding: 10px; background: #f0f0f0; display: flex; gap: 8px; }
    .input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
    .input-area button { background: #128c7e; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">Chat en Vivo</div>
  <div class="room-info" id="roomLabel">Conectando...</div>
  <div class="messages-box" id="messagesBox"></div>
  <div class="input-area">
    <input type="text" id="username" placeholder="Tu nombre" style="max-width: 90px;">
    <input type="text" id="messageInput" placeholder="Mensaje..." autocomplete="off">
    <button id="sendBtn">Enviar</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let room = window.location.hash.substring(1);
  if (!room) {
    room = "sala-principal";
    window.location.hash = room;
  }

  document.getElementById('roomLabel').textContent = `Sala actual: #${room}`;
  socket.emit('joinRoom', room);

  const messagesBox = document.getElementById('messagesBox');
  const messageInput = document.getElementById('messageInput');
  const usernameInput = document.getElementById('username');
  const sendBtn = document.getElementById('sendBtn');

  function sendMessage() {
    const text = messageInput.value.trim();
    const user = usernameInput.value.trim() || 'Anónimo';

    if (text !== '') {
      socket.emit('sendMessage', { room, user, message: text });
      messageInput.value = '';
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  socket.on('newMessage', (data) => {
    const isMine = data.user === (usernameInput.value.trim() || 'Anónimo');
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message');
    if (isMine) msgDiv.classList.add('mine');

    msgDiv.innerHTML = `
      <div class="meta">${data.user}</div>
      <div class="text">${data.message}</div>
      <div class="time">${data.time}</div>
    `;

    messagesBox.appendChild(msgDiv);
    messagesBox.scrollTop = messagesBox.scrollHeight;
  });
</script>
</body>
</html>
